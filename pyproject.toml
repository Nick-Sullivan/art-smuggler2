[project]
name = "all-things-ones"
version = "0.1.0"
description = "Experiments in splitting an image into layers that stack to reveal it"
authors = [
    {name = "Nick Sullivan", email = "nick.dave.sullivan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python==4.12.0.88",
    "pillow==11.3.0",
    "scipy==1.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/all_things_ones"]

[tool.uv]
dev-dependencies = []
